<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="description" content="Root Flower Kuching">
    <meta name="keywords" content="Root Flower Kuching, Flowers, Bouquets, Workshop">
    <meta name="author" content="YanHanWONG">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="icon" type="image/png" href="Images/FlowerLogo.jpg">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="script.js"></script>

</head>

<body>

    <article>

        <!-- Header -->
        <header class="index-header">
            <nav aria-label="Main navigation" class="index-nav">
                <ul id="navList" class="index-nav-list">
                </ul>
            </nav>
        </header>

        <!-- Main Content -->
        <main class="register-main">
            <h1>Workshop Registration</h1>
            <form id="detail" method="post" action="confirm.html" novalidate="novalidate">
                <fieldset>
                    <p>
                        <label>Subject:</label>
                        <input type="text" id="subject" name="subject">
                        <span class="error-message" id="subject_error"></span> </p>
                    <p>
                        <label for="workshop">Workshop Topics:</label>
                        <select id="workshop" onchange="change()">
                    <option value="">-- Select a Topics --</option>
                </select>
                        <span class="error-message" id="workshop_error"></span> </p>
                    <p>
                        <label>Comments:</label>
                        <textarea name="comments" rows="4" cols="40"></textarea>
                        <span class="error-message" id="comments_error"></span>
                    </p>
                    <p>
                        <p><label>Session Time:</label>
                            <div class="radio">
                                <input type="radio" name="session" value="morning"> Morning
                                <input type="radio" name="session" value="afternoon"> Afternoon
                                <input type="radio" name="session" value="evening"> Evening
                            </div>
                            <span class="error-message" id="session_error"></span>
                        </p>
                        <label>Workshop Date (From):</label>
                        <input type="date" name="start_date">
                        <span class="error-message" id="start_date_error"></span> </p>
                    <p>
                        <label>Workshop Date (To):</label>
                        <input type="date" name="end_date">
                        <span class="error-message" id="end_date_error"></span> </p>
                    <p>
                        <label>Number of Participants:</label>
                        <input type="text" name="participants">
                        <span class="error-message" id="participants_error"></span> </p>
                </fieldset>

                <fieldset>
                    <legend>Personal Details</legend>
                    <p>
                        <label>First Name:</label>
                        <input type="text" name="fname">
                        <span class="error-message" id="fname_error"></span> </p>
                    <p>
                        <label>Last Name:</label>
                        <input type="text" name="lname">
                        <span class="error-message" id="lname_error"></span> </p>
                    <p>
                        <label>Email Address:</label>
                        <input type="email" name="email">
                        <span class="error-message" id="email_error"></span> </p>
                    <p>
                        <label>Phone Number:</label>
                        <input type="tel" name="phone" placeholder="0123456789">
                        <span class="error-message" id="phone_error"></span> </p>
                </fieldset>

                <fieldset>
                    <legend>Address</legend>
                    <p>
                        <label>Street Address:</label>
                        <input type="text" name="street">
                        <span class="error-message" id="street_error"></span> </p>
                    <p>
                        <label>City/Town:</label>
                        <input type="text" name="city">
                        <span class="error-message" id="city_error"></span> </p>
                    <p>
                        <label>State:</label>
                        <select name="state">
                    <option value="">--Select--</option>
                        <option value="Johor">Johor</option>
                        <option value="Kedah">Kedah</option>
                        <option value="Kelantan">Kelantan</option>
                        <option value="Kuala Lumpur">Kuala Lumpur</option>
                        <option value="Labuan">Labuan</option>
                        <option value="Melaka">Melaka</option>
                        <option value="Negeri Sembilan">Negeri Sembilan</option>
                        <option value="Pahang">Pahang</option>
                        <option value="Penang">Penang</option>
                        <option value="Perak">Perak</option>
                        <option value="Perlis">Perlis</option>
                        <option value="Putrajaya">Putrajaya</option>
                        <option value="Sabah">Sabah</option>
                        <option value="Sarawak">Sarawak</option>
                        <option value="Selangor">Selangor</option>
                        <option value="Terengganu">Terengganu</option>
                </select>
                        <span class="error-message" id="state_error"></span> </p>
                    <p>
                        <label>Postcode:</label>
                        <input type="text" name="postcode">
                        <span class="error-message" id="postcode_error"></span> </p>
                </fieldset>

                <p>
                    <input type="submit" value="Register">
                    <input type="reset" value="Clear">
                </p>
            </form>
        </main>
        <button id="scrollTopBtn" title="Back to top">
    <i class="fa fa-level-up"></i>
</button>
        <!-- Footer -->
        <footer class="index-footer ">
            <p>
                <a href="mailto:104392138@students.swinburne.edu.my ">Created by: YanHan WONG</a> |
                <a href="index.html#index-contact ">Contact Us</a>|
                <a href="acknowledgement.html ">Acknowledgement</a> |
                <a href="enhancement1.html ">Enhancement 1</a>|
                <a href="enhancement2.html ">Enhancement 2</a>
            </p>
        </footer>
    </article>
</body>

</html>
